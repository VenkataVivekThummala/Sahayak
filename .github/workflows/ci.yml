name: Government Sahayak CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run PyTest Test Suite
        run: |
          python -m pytest backend/tests/ -v
      - name: Run Evaluation Script
        run: |
          python -m scripts.evaluate

  mobile-tests:
    name: Mobile Typecheck & Parity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci
      - name: TypeScript Typecheck
        working-directory: ./mobile
        run: npm run typecheck
      - name: Run Jest Engine Parity & i18n Tests
        working-directory: ./mobile
        run: npm test

  helpdesk-web-build:
    name: Helpdesk Web Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: helpdesk-web/package-lock.json
      - name: Install Dependencies
        working-directory: ./helpdesk-web
        run: npm ci
      - name: Build Production Bundle
        working-directory: ./helpdesk-web
        run: npm run build
